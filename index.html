<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastalavista 2026</title>
<meta name="description" content="Kleehs + Hoosiers · Rome &amp; Tuscany · Jul 17–26 2026">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#C05A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pastalavista">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --terra:#C05A33; --terra-dark:#A34527; --terra-soft:#EAC3AF;
  --cream:#FAF4E8; --card:#FFFDF8; --ink:#33261D; --ink-soft:#7A6A5C;
  --green:#2E4A33; --green-soft:#DFE6DA; --olive:#8B8B4F;
  --gold:#C9A227; --line:#EBDFCC;
  --shadow:0 1px 2px rgba(51,38,29,.06),0 4px 14px rgba(51,38,29,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:120px}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--cream); color:var(--ink);
  font-size:15.5px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.disp{font-family:'Fraunces',Georgia,serif}
a{color:var(--terra-dark)}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,var(--terra) 0%,var(--terra-dark) 100%);
  padding-top:env(safe-area-inset-top);
  box-shadow:0 2px 10px rgba(51,38,29,.25);
}
.brand{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.brand h1{color:var(--cream);font-size:21px;font-weight:700;letter-spacing:.5px}
.brand h1 span{color:#F2C98F}
.brand small{color:#F2C98F;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.brandr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.todaybtn{border:0;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.4px;background:var(--gold);color:#3d2f05;border-radius:999px;padding:6px 14px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.todaybtn:active{background:#fff}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px 12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:0;cursor:pointer;border-radius:14px;
  background:rgba(250,244,232,.13);color:var(--cream);
  padding:7px 13px 6px;text-align:center;line-height:1.15;
  font-family:'Inter',sans-serif;position:relative;
}
.tab .dw{display:block;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.tab .dt{display:block;font-size:15px;font-weight:700}
.tab.on{background:var(--cream);color:var(--terra-dark)}
.tab.din{background:rgba(201,162,39,.32)}
.tab.din .dt{font-size:16px}
.tab.din.on{background:var(--cream);color:var(--terra-dark)}
.tab .today-dot{position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- day screen ---------- */
main{max-width:660px;margin:0 auto;padding:16px 14px 60px}
.dayhead{padding:6px 4px 14px}
.dayhead .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--terra-dark)}
.dayhead h2{font-size:30px;font-weight:700;line-height:1.1;margin:2px 0 4px}
.dayhead .base{font-size:13.5px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;letter-spacing:.3px}
.chip.locked{background:var(--green);color:#fff}
.chip.pick{background:var(--gold);color:#3d2f05}
.chip.semi{background:var(--olive);color:#fff}
.chip.heat{background:#F6E3D3;color:#A0431B}
.chip.wx{background:#E7EEF2;color:#2E5568;font-variant-numeric:tabular-nums}
.chip.home{background:var(--green);color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.chip.uber{background:var(--ink);color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.chip.today{background:var(--terra);color:#fff}

/* ---------- timeline ---------- */
.trackname{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--green);margin:20px 4px 10px;display:flex;align-items:center;gap:8px}
.trackname::after{content:"";flex:1;height:1px;background:var(--line)}
.tl{list-style:none;position:relative;padding-left:74px}
.tl::before{content:"";position:absolute;left:58px;top:8px;bottom:8px;width:2px;background:var(--terra-soft);border-radius:2px}
.tl li{position:relative;margin-bottom:10px}
.tl li::before{content:"";position:absolute;left:-21px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--terra);border:2px solid var(--cream)}
.tl li.hl::before{background:var(--gold)}
.tl .time{position:absolute;left:-74px;top:13px;width:46px;text-align:right;font-size:11.5px;font-weight:700;color:var(--terra-dark);line-height:1.2}
.tlcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}
.tl li.hl .tlcard{border-color:var(--gold);background:#FFFAEB}
.tlcard .t{font-weight:600;font-size:15px}
.tlcard .s{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.tlcard .s b{color:var(--ink)}
.warn{display:flex;gap:6px;font-size:13px;background:#FBEEE2;color:#8A4519;border-radius:9px;padding:7px 10px;margin-top:8px}
.note{font-size:13px;background:var(--green-soft);color:var(--green);border-radius:9px;padding:7px 10px;margin-top:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.btn{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:13.5px;font-weight:600;border-radius:11px;padding:9px 13px;
  min-height:40px;border:0;cursor:pointer;font-family:'Inter',sans-serif;
}
.btn.maps{background:var(--green);color:#fff}
.btn.dir{background:var(--green-soft);color:var(--green)}
.btn.tel{background:#F6E3D3;color:var(--terra-dark)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft)}

/* ---------- menu cards ---------- */
.pickbar{font-size:13.5px;color:var(--ink-soft);background:#F4ECDD;border:1px dashed var(--terra-soft);border-radius:12px;padding:11px 13px;margin-bottom:16px;line-height:1.55}
.pickbar b{color:var(--ink)}
.menuhead{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--green);margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.menuhead::after{content:"";flex:1;height:1px;background:var(--line)}
.secnote{font-size:13px;color:var(--ink-soft);margin:-4px 4px 12px}
.steps{list-style:none;margin:2px 0 4px;padding:0}
.steps li{display:flex;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px}
.steps li:first-child{border-top:0}
.steps .st{flex:0 0 42px;font-weight:700;color:var(--terra-dark);font-size:12px;padding-top:1px}
.steps li div{flex:1}
.flip{display:flex;gap:8px;font-size:13px;background:#FFF6E4;border:1px solid var(--gold);color:#6B5410;border-radius:10px;padding:9px 11px;margin:4px 0 8px;line-height:1.5}
.flip b{color:#4d3c08}
.gal{display:flex;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:4px 0 8px;padding-bottom:2px}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 auto;width:150px;margin:0}
.gal img{width:150px;height:100px;object-fit:cover;border-radius:11px;display:block;box-shadow:var(--shadow)}
.gal figcaption{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.3}
.dayhead + .gal{margin:0 0 14px}
.gelato{margin:6px 0 8px}
.gelato .gh{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--green);margin-bottom:6px}
.gelato ol{margin:0;padding-left:20px}
.gelato li{font-size:13px;color:var(--ink-soft);margin-bottom:6px;line-height:1.45}
.gelato .glink{font-weight:700;color:var(--terra-dark);text-decoration:none}
.spots{margin:4px 0 4px}
.spot{border-top:1px dashed var(--line);padding:10px 0 4px}
.spot:first-child{border-top:0}
.spot-t{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:15px}
.spot-t .rate{font-size:11.5px;font-weight:700;color:#8a6d0f;background:#FBF3D9;border-radius:6px;padding:1px 7px}
.spot-t .cl{font-size:11px;font-weight:700;color:#A0431B;background:#F6E3D3;border-radius:6px;padding:1px 7px}
.spot-t .tag{font-size:11px;font-weight:700;color:#2E4A33;background:var(--green-soft);border-radius:6px;padding:1px 7px}
.spot-d{font-size:13px;color:var(--ink-soft);margin:3px 0 5px;line-height:1.5}
.spot-h{font-size:12px;color:var(--ink-soft);margin-bottom:7px}
.alert{font-size:13.5px;background:#F6E3D3;border:1px solid #E0A87A;color:#8A4519;border-radius:12px;padding:11px 13px;margin-bottom:14px;line-height:1.55}
.alert b{color:#6B3413}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.opt summary{list-style:none;cursor:pointer;position:relative}
.opt summary::-webkit-details-marker{display:none}
.hero{position:relative;height:132px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero .emoji{font-size:52px;filter:drop-shadow(0 3px 6px rgba(51,38,29,.25))}
.hero .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-align:center;color:rgba(255,255,255,.95)}
.hero .ph-cam{font-size:30px;opacity:.85;filter:drop-shadow(0 2px 4px rgba(51,38,29,.3))}
.hero .ph-lbl{font-size:11.5px;font-weight:600;letter-spacing:.3px;background:rgba(51,38,29,.42);padding:4px 11px;border-radius:999px;backdrop-filter:blur(2px)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.hero img.ok{opacity:1}
.hero img.ok ~ .emoji{opacity:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.28));opacity:0;transition:opacity .4s;pointer-events:none}
.hero:has(img.ok)::after{opacity:1}
.hero .letter{
  position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:10px;
  background:rgba(250,244,232,.92);color:var(--terra-dark);
  font-family:'Fraunces',serif;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.hero .fin{
  position:absolute;top:10px;right:10px;z-index:2;
  font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  background:rgba(51,38,29,.55);color:#F7ECD4;border-radius:999px;padding:4px 9px;backdrop-filter:blur(3px);
}
.g1{background:linear-gradient(135deg,#C05A33,#E09B6B)}
.g2{background:linear-gradient(135deg,#2E4A33,#6E8F5E)}
.g3{background:linear-gradient(135deg,#8B8B4F,#C9BE7C)}
.g4{background:linear-gradient(135deg,#A34527,#C9A227)}
.opt .head{padding:12px 14px 4px}
.opt .head h3{font-size:19px;font-weight:600;line-height:1.2}
.opt .head .pitch{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:5px 12px;padding:8px 14px 12px;font-size:12.5px;color:var(--ink-soft)}
.meta span{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.opt .more{padding:0 14px 14px;border-top:1px dashed var(--line);margin-top:2px;padding-top:11px}
.opt .more p{font-size:14px;margin-bottom:8px}
.expander{display:flex;justify-content:center;padding:0 0 8px;color:var(--terra-soft);font-size:11px;letter-spacing:1px}
.opt[open] .expander{display:none}

/* ---------- reference ---------- */
.walk{background:var(--card);border:1px solid var(--gold);border-radius:16px;box-shadow:var(--shadow);padding:16px 16px 4px;margin-top:16px;background:linear-gradient(180deg,#FFF9EC,var(--card))}
.walk-t{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--terra-dark)}
.walk-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.55}
.walkstops{list-style:none;margin:12px 0 0;padding:0}
.walkstops li{display:flex;gap:12px;padding-bottom:16px;position:relative}
.walkstops li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--terra-soft)}
.walkstops li:last-child::before{display:none}
.walkroute{width:100%;justify-content:center;margin:12px 0 8px}
.walknote{font-size:12.5px;color:var(--ink-soft);background:#FFF6E4;border:1px solid var(--gold);border-radius:10px;padding:8px 11px;margin-bottom:12px;line-height:1.5}
.walknote b{color:#6B5410}
.ws-ic{flex:0 0 34px;height:34px;border-radius:50%;background:var(--terra);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1}
.ws-ic.off{background:#F4E7CC;color:var(--ink);font-weight:400;font-size:16px}
.ws-b{flex:1;min-width:0;padding-top:3px}
.ws-l{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--terra-dark)}
.ws-t{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:2px 0 4px}
.ws-d{font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.refsec{margin-bottom:22px}
.refsec>h3{font-size:21px;font-weight:700;color:var(--green);margin:0 4px 10px;display:flex;align-items:center;gap:8px}
.refsec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.refcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.refcard .t{font-weight:600;font-size:15.5px}
.refcard .s{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.refcard .s b{color:var(--ink)}
.code{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13.5px;font-weight:600;
  background:#F1E6CF;color:#6B4A12;border-radius:8px;padding:5px 9px;margin:6px 6px 0 0;
}
.code:active{background:var(--gold);color:#fff}

/* ---------- pending ---------- */
.pend{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.pend input{width:22px;height:22px;margin-top:1px;accent-color:var(--green);flex:0 0 auto}
.pend.done label{text-decoration:line-through;color:var(--ink-soft)}
.pend label{font-size:14.5px}
.pend .who{display:block;font-size:12px;color:var(--terra-dark);font-weight:600;margin-top:2px}

footer{max-width:660px;margin:0 auto;padding:0 18px 40px;font-size:12px;color:#B3A28F;text-align:center}
@media(min-width:700px){ .brand h1{font-size:24px} .hero{height:170px} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>PASTA<span>LA</span>VISTA</h1>
    <button id="todayBtn" class="todaybtn" hidden>◉ Today</button>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="app"></main>

<footer>Pastalavista 2026 · Kleehs + Hoosiers · buon viaggio 🍝</footer>

<script>
/* =====================  DATA  ===================== */

const mapsQ = q => 'https://maps.google.com/?q=' + encodeURIComponent(q);
// Place link with a verified Google place_id (preferred). Fall back to mapsQ(name) when no id.
const mapsPid = (name,id) => id
  ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name) + '&query_place_id=' + id
  : mapsQ(name);
const dirTo = (o,dst,mode) => 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(o) + '&destination=' + encodeURIComponent(dst) + '&travelmode=' + (mode||'driving');
// Uber from the rider's current location to a fixed dropoff (opens the Uber app prefilled).
const uberTo = (lat,lng,name) => 'https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[latitude]=' + lat + '&dropoff[longitude]=' + lng + '&dropoff[nickname]=' + encodeURIComponent(name);
const HEAT = '🥵 Heat wave — mornings out, shade or pool at midday';

/* ---- live weather (Open-Meteo, free, no key, °F) ---- */
const LOCS = {
  rome:  {lat:41.9028, lon:12.4964},
  sangim:{lat:43.4677, lon:11.0430}, // San Gimignano / Poderi Arcangelo
  cetona:{lat:42.9636, lon:11.8996},
};
// which base each screen sits at (+ explicit date for the dinner screens, + that night's lodging)
// [label, maps query, optional [lat,lng] for an Uber-home chip — Rome only; Uber doesn't serve rural Tuscany]
const H_CIAO=['🏠 Ciao Bella','Via Mecenate 27 Roma',[41.8957,12.5017]], H_BIG=['🏠 Big House','Via Merulana 105 Roma',[41.8925,12.5009]],
      H_PODERI=['🏠 Poderi','Poderi Arcangelo San Gimignano'], H_VILLA=['🏠 Villa','Podere San Girolamo Cetona'],
      H_MONTI=['🏠 Monti','Via dei Serpenti 109 Roma',[41.8945,12.4905]];
const DAYMETA = {
  fri17:{loc:'rome',home:[H_CIAO,H_BIG]}, sat18:{loc:'rome',home:[H_CIAO,H_BIG]}, sun19:{loc:'sangim',home:[H_PODERI]},
  mon20:{loc:'sangim',home:[H_PODERI]}, din1:{loc:'sangim',date:'2026-07-20',home:[H_PODERI]},
  tue21:{loc:'sangim',home:[H_PODERI]}, din2:{loc:'sangim',date:'2026-07-21',home:[H_PODERI]},
  wed22:{loc:'cetona',home:[H_VILLA]}, thu23:{loc:'cetona',home:[H_VILLA]}, din3:{loc:'cetona',date:'2026-07-23',home:[H_VILLA]},
  fri24:{loc:'cetona',home:[H_VILLA]}, din4:{loc:'cetona',date:'2026-07-24',home:[H_VILLA]},
  sat25:{loc:'rome',home:[H_MONTI]}, satnight:{loc:'rome',date:'2026-07-25',home:[H_MONTI]}, sun26:{loc:'rome',home:[H_MONTI]},
};
let WX = null;
const wxDateFor = d => { const m = DAYMETA[d.id]; return m ? (m.date || '2026-07-' + String(d.num).padStart(2,'0')) : null; };
function wxIcon(c){
  if(c===0) return '☀️';
  if(c<=2) return '🌤️';
  if(c===3) return '☁️';
  if(c<=48) return '🌫️';
  if(c<=57) return '🌦️';
  if(c<=67) return '🌧️';
  if(c<=77) return '🌨️';
  if(c<=82) return '🌦️';
  if(c<=86) return '🌨️';
  return '⛈️';
}
function fillWx(){
  if(!WX) return;
  document.querySelectorAll('.chip.wx').forEach(el=>{
    const loc = WX[el.dataset.loc]; const w = loc && loc[el.dataset.date];
    if(w && w.max!=null){ el.textContent = `${wxIcon(w.code)} ${Math.round(w.max)}° / ${Math.round(w.min)}°F`; el.hidden=false; }
  });
}
function loadWeather(){
  try{
    const c = JSON.parse(localStorage.getItem('plv-wx')||'null');
    if(c && c.ts && (Date.now()-c.ts) < 3*3600*1000 && c.data){ WX = c.data; fillWx(); return; }
  }catch(e){}
  const keys = Object.keys(LOCS);
  const lat = keys.map(k=>LOCS[k].lat).join(',');
  const lon = keys.map(k=>LOCS[k].lon).join(',');
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=Europe%2FRome&forecast_days=16`;
  fetch(url).then(r=>r.json()).then(j=>{
    const arr = Array.isArray(j) ? j : [j];
    const data = {};
    keys.forEach((k,i)=>{
      const dd = arr[i] && arr[i].daily; if(!dd || !dd.time) return;
      const m = {};
      dd.time.forEach((t,idx)=>{ m[t] = {max:dd.temperature_2m_max[idx], min:dd.temperature_2m_min[idx], code:dd.weather_code[idx]}; });
      data[k] = m;
    });
    if(Object.keys(data).length){
      WX = data;

/* =====================  RENDER  ===================== */

const app = document.getElementById('app');
const tabs = document.getElementById('tabs');

function todayId(){
  const n = new Date();
  if(n.getFullYear()===2026 && n.getMonth()===6 && n.getDate()>=17 && n.getDate()<=26){
    const d = DAYS.find(d=>+d.num===n.getDate());
    return d ? d.id : null;
  }
  return null;
}
const TODAY = todayId();

function btnHtml(b){
  const [cls,label,href,tel] = b;
  if(tel) return `<a class="btn tel" href="tel:${tel}">${label}</a>`;
  return `<a class="btn ${cls}" href="${href}" target="_blank" rel="noopener">${label}</a>`;
}

function rowHtml(r){
  return `<li class="${r.hl?'hl':''}">
    <span class="time">${r.t}</span>
    <div class="tlcard">
      <div class="t">${r.title}${r.pending?' <span class="chip pick" style="font-size:10px;vertical-align:2px">pending</span>':''}</div>
      ${r.s?`<div class="s">${r.s}</div>`:''}
      ${r.warn?`<div class="warn">⚠️ <span>${r.warn}</span></div>`:''}
      ${r.note?`<div class="note">${r.note}</div>`:''}
      ${r.btns?`<div class="btnrow">${r.btns.map(btnHtml).join('')}</div>`:''}
    </div></li>`;
}

function galleryHtml(g){
  return `<div class="gal">${g.map(([src,label])=>`<figure><img loading="lazy" src="${src}" alt="${label}" onerror="this.closest('figure').remove()"><figcaption>${label}</figcaption></figure>`).join('')}</div>`;
}

function walkCard(w){
  return `<div class="walk">
    <div class="walk-hd"><div class="walk-t">${w.title}</div><div class="walk-sub">${w.sub}</div></div>
    ${w.route?`<a class="btn maps walkroute" href="${w.route}" target="_blank" rel="noopener">🗺️ Open the walking route · A → B → C</a>`:''}
    ${w.routeNote?`<div class="walknote">📍 ${w.routeNote}</div>`:''}
    <ol class="walkstops">${w.stops.map(s=>`
      <li>
        <div class="ws-ic ${s.off?'off':''}">${s.mark}</div>
        <div class="ws-b">
          ${s.label?`<div class="ws-l">${s.label}</div>`:''}
          <div class="ws-t">${s.t}</div>
          <div class="ws-d">${s.d}</div>
          ${s.btns?`<div class="btnrow">${s.btns.map(btnHtml).join('')}</div>`:''}
        </div>
      </li>`).join('')}</ol>
  </div>`;
}

function optHtml(o){
  const hero = `<div class="hero ${o.g||'g1'}">
      ${o.img?`<img loading="lazy" src="${o.img}" alt="${o.title}" onload="this.classList.add('ok')" onerror="this.remove()">`:''}
      ${o.photoTBD?`<span class="ph"><span class="ph-cam">📷</span><span class="ph-lbl">Photo coming · ${o.photoTBD}</span></span>`
        :(o.img&&o.img.startsWith('photos/'))?'':`<span class="emoji">${o.e}</span>`}
      ${o.k?`<span class="letter">${o.k}</span>`:''}
      ${o.verified?'':'<span class="fin">being finalized</span>'}
    </div>`;
  const meta = (o.drive||o.hours||o.price)?`<div class="meta">
      ${o.drive?`<span>🚗 ${o.drive}</span>`:''}
      ${o.hours?`<span>🕐 ${o.hours}</span>`:''}
      ${o.price?`<span>💶 ${o.price}</span>`:''}
    </div>`:'';
  const steps = o.steps?`<ol class="steps">${o.steps.map(s=>`<li><span class="st">${s.t}</span><div>${s.txt}</div></li>`).join('')}</ol>`:'';
  const spots = o.spots?`<div class="spots">${o.spots.map(s=>`
      <div class="spot">
        <div class="spot-t"><b>${s.name}</b>${s.rating?`<span class="rate">★ ${s.rating}</span>`:''}${s.tag?`<span class="tag">${s.tag}</span>`:''}${s.closed?`<span class="cl">${s.closed}</span>`:''}</div>
        <div class="spot-d">${s.desc}</div>
        ${s.hours?`<div class="spot-h">🕐 ${s.hours}</div>`:''}
        <div class="btnrow">
          ${s.tel?`<a class="btn tel" href="tel:${s.tel}">📞 Call</a>`:''}
          ${s.map?`<a class="btn maps" href="${s.map}" target="_blank" rel="noopener">🗺️ Map</a>`:''}
        </div>
      </div>`).join('')}</div>`:'';
  const flip = o.flip?`<div class="flip">🔄 <div>${o.flip}</div></div>`:'';
  const gelato = o.gelato?`<div class="gelato"><div class="gh">🍦 Top 5 gelato</div><ol>${o.gelato.map(([name,note,q])=>`<li><a class="glink" href="${mapsQ(q)}" target="_blank" rel="noopener">${name}</a> — ${note}</li>`).join('')}</ol></div>`:'';
  const gallery = o.gallery?galleryHtml(o.gallery):'';
  const links = (o.links||[]).map(l=>`<a class="btn dir" href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('');
  return `<details class="opt"${o.open?' open':''}>
    <summary>${hero}
      <div class="head"><h3>${o.title}</h3><div class="pitch">${o.pitch}</div></div>
      ${meta}
      <div class="expander">▾ TAP FOR DETAILS ▾</div>
    </summary>
    <div class="more">
      ${o.more?`<p>${o.more}</p>`:''}
      ${steps}
      ${spots}
      ${gelato}
      ${gallery}
      ${flip}
      ${o.warn?`<div class="warn" style="margin-bottom:8px">⚠️ <span>${o.warn}</span></div>`:''}
      <div class="btnrow">
        ${o.maps?`<a class="btn maps" href="${o.maps}" target="_blank" rel="noopener">🗺️ Open in Maps</a>`:''}
        ${o.dir?`<a class="btn dir" href="${o.dir}" target="_blank" rel="noopener">🚗 Directions</a>`:''}
        ${links}
      </div>
    </div>
  </details>`;
}

function chipRow(d){
  const lock = {locked:['locked','🔒 Locked timeline'],semi:['semi','🔗 Semi-locked'],pick:['pick','☝️ Pick one'],set:['locked','📌 Locked in']}[d.lock];
  const dm = DAYMETA[d.id];
  const wx = dm ? `<span class="chip wx" data-loc="${dm.loc}" data-date="${wxDateFor(d)}" hidden></span>` : '';
  const home = dm && dm.home ? dm.home.map(h=>{
    const nm = h[0].replace(/^🏠\s*/,'');
    let s = `<a class="chip home" href="${mapsQ(h[1])}" target="_blank" rel="noopener">${h[0]}</a>`;
    if(h[2]) s += `<a class="chip uber" href="${uberTo(h[2][0],h[2][1],nm)}" target="_blank" rel="noopener">🚕 Uber ${nm}</a>`;
    return s;
  }).join('') : '';
  return `<div class="chips">
    ${TODAY===d.id?'<span class="chip today">TODAY</span>':''}
    ${wx}
    ${home}
    <span class="chip ${lock[0]}">${lock[1]}</span>
    ${d.heat?`<span class="chip heat">${HEAT}</span>`:''}
  </div>`;
}

function dayScreen(d){
  let h = `<div class="dayhead">
    <div class="eyebrow">${d.eyebrow || `${d.dow} · July ${d.num} · 2026`}</div>
    <h2>${d.name}</h2>
    <div class="base">${d.base}</div>
    ${chipRow(d)}
  </div>`;
  if(d.gallery) h += galleryHtml(d.gallery);
  if(d.sections){
    if(d.intro) h += `<div class="pickbar">☝️ ${d.intro}</div>`;
    d.sections.forEach(sec=>{
      h += `<div class="menuhead">${sec.label}</div>`;
      if(sec.note) h += `<div class="secnote">${sec.note}</div>`;
      h += sec.items.map(optHtml).join('');
    });
    if(d.extra) h += optHtml(d.extra);
  } else if(d.menu){
    if(d.alert) h += `<div class="alert">⚠️ ${d.alert}</div>`;
    h += `<div class="pickbar">☝️ ${d.intro}</div>`;
    h += d.menu.map(optHtml).join('');
    if(d.extra) h += optHtml(d.extra);
  } else if(d.walk){
    if(d.intro) h += `<div class="pickbar">${d.intro}</div>`;
    h += walkCard(d.walk);
  } else {
    d.tracks.forEach(tr=>{
      if(tr.name) h += `<div class="trackname">${tr.name}</div>`;
      h += `<ul class="tl">${tr.rows.map(rowHtml).join('')}</ul>`;
    });
    if(d.foot) h += `<div class="warn" style="margin-top:4px">${d.foot}</div>`;
  }
  return h;
}

function refScreen(){
  let h = `<div class="dayhead"><div class="eyebrow">Everything in one place</div><h2>Reference 📋</h2>
    <div class="base">Tap any code to copy it · tap 📞 to dial</div></div>`;
  REF.forEach(sec=>{
    h += `<div class="refsec"><h3>${sec.h}</h3>`;
    sec.cards.forEach(c=>{
      h += `<div class="refcard"><div class="t">${c.t}</div><div class="s">${c.s}</div>`;
      if(c.codes) h += c.codes.map(k=>`<button class="code" onclick="copyCode(this,'${k}')">${k} ⧉</button>`).join('');
      let btns='';
      if(c.pdf) btns += `<a class="btn maps" href="${c.pdf[0]}" target="_blank" rel="noopener">📄 ${c.pdf[1]}</a>`;
      if(c.link) btns += `<a class="btn dir" href="${c.link[0]}" target="_blank" rel="noopener">📄 ${c.link[1]}</a>`;
      if(c.tel) btns += `<a class="btn tel" href="tel:${c.tel[0]}">📞 ${c.tel[1]}</a>`;
      if(c.mail) btns += `<a class="btn tel" href="mailto:${c.mail}">✉️ ${c.mail}</a>`;
      if(c.maps) btns += `<a class="btn maps" href="${mapsQ(c.maps[0])}" target="_blank" rel="noopener">🗺️ ${c.maps[1]}</a>`;
      if(c.maps2) btns += `<a class="btn maps" href="${mapsQ(c.maps2[0])}" target="_blank" rel="noopener">🗺️ ${c.maps2[1]}</a>`;
      if(btns) h += `<div class="btnrow">${btns}</div>`;
      h += `</div>`;
    });
    h += `</div>`;
  });
  return h;
}

function pendScreen(){
  const done = JSON.parse(localStorage.getItem('plv-pending')||'{}');
  let h = `<div class="dayhead"><div class="eyebrow">Open items</div><h2>Pending ⏳</h2>
    <div class="base">Checks save on this phone only</div></div>`;
  PENDING.forEach((p,i)=>{
    h += `<div class="pend ${done[i]?'done':''}" id="pend${i}">
      <input type="checkbox" id="pc${i}" ${done[i]?'checked':''} onchange="togglePend(${i},this.checked)">
      <label for="pc${i}">${p.t}<span class="who">→ ${p.who}</span>
      ${p.tel?`<a class="btn tel" style="margin-top:7px" href="tel:${p.tel}">📞 Call</a>`:''}</label>
    </div>`;
  });
  return h;
}

function togglePend(i,v){
  const done = JSON.parse(localStorage.getItem('plv-pending')||'{}');
  done[i]=v; localStorage.setItem('plv-pending',JSON.stringify(done));
  document.getElementById('pend'+i).classList.toggle('done',v);
}

function copyCode(el,txt){
  const t = txt.replace(/^PIN /,'');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{
    const old = el.textContent; el.textContent = '✓ copied';
    setTimeout(()=>{el.textContent = old;},1200);
  }).catch(()=>{});
}

/* ---- tabs + routing ---- */

const SCREENS = [
  ...DAYS.map(d=>({id:d.id,dw:d.dow,dt:d.num,din:d.dinner,render:()=>dayScreen(d)})),
  {id:'ref',dw:'Info',dt:'📋',render:refScreen},
  {id:'pend',dw:'To-do',dt:'⏳',render:pendScreen},
];

function show(id){
  const s = SCREENS.find(x=>x.id===id) || SCREENS[0];
  app.innerHTML = s.render();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===s.id));
  const on = document.querySelector('.tab.on');
  if(on) on.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+s.id)}catch(e){}
  fillWx();
}

tabs.innerHTML = SCREENS.map(s=>`<button class="tab ${s.din?'din':''}" data-id="${s.id}">
  ${TODAY===s.id?'<span class="today-dot"></span>':''}
  <span class="dw">${s.dw}</span><span class="dt">${s.dt}</span></button>`).join('');
tabs.addEventListener('click',e=>{
  const b = e.target.closest('.tab'); if(b) show(b.dataset.id);
});

// Reload with a unique ?r=<timestamp> so iOS can't serve a stale cached copy; land on `hash`.
function hardRefresh(hash){ location.replace(location.pathname + '?r=' + Date.now() + (hash||'')); }

// Today now also force-refreshes (fetches the latest) on its way to today's screen.
const todayBtn = document.getElementById('todayBtn');
if(TODAY){ todayBtn.hidden = false; todayBtn.addEventListener('click',()=>hardRefresh('#'+TODAY)); }

// Cold open → jump to today; a refresh-reload (?r=) keeps the screen you were on.
const _hashId = location.hash.replace('#','');
const _isRefresh = /[?&]r=/.test(location.search);
show(_isRefresh ? (_hashId || TODAY || 'fri17') : (TODAY || _hashId || 'fri17'));
loadWeather();
